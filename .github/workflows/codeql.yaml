---
name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "34 0 * * 3"

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/codeql.yaml@6789e14ea4c77fed705a851e091ad9024f8c97eb # main
    with:
      language: java
    permissions:
      actions: read
      contents: read
      security-events: write
