---
name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "34 0 * * 3"

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/codeql.yaml@89cbb1141fe004836ee6ca584ad6f4861c2af621 # main
    with:
      language: java
    permissions:
      actions: read
      contents: read
      security-events: write
