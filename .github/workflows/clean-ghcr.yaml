on:
  schedule:
    - cron: "0 1 * * *"  # every day at midnight
  workflow_dispatch:

permissions:
  contents: read
jobs:
  trigger:
    uses: statnett/github-workflows/.github/workflows/clean-ghcr.yaml@6789e14ea4c77fed705a851e091ad9024f8c97eb # main
    secrets: inherit
    permissions:
      packages: write
